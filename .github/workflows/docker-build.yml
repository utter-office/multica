name: CI

# multica fork 镜像构建（仿 utter-office/utter-office 的 docker-build.yml）
# push utter-main / tag v* → go test + docker buildx 双推 GHCR + 阿里云 ACR（供 SIT / 客户私有化部署拉取）
# 上游 release.yml 的镜像发布有 github.repository_owner == 'multica-ai' 守卫，fork 不会出镜像，因此本 workflow 独立产出。
on:
  push:
    branches: [utter-main]
    tags: ['v*']
  workflow_dispatch:

env:
  ALIYUN_REGISTRY: registry.cn-hangzhou.aliyuncs.com
  # 与 utter-office 共用 ACR 命名空间（同一账号资源）
  ALIYUN_IMAGE_BACKEND: registry.cn-hangzhou.aliyuncs.com/nothing/multica-backend
  ALIYUN_IMAGE_WEB: registry.cn-hangzhou.aliyuncs.com/nothing/multica-web
  ALIYUN_IMAGE_EXECUTOR: registry.cn-hangzhou.aliyuncs.com/nothing/multica-executor
  ALIYUN_IMAGE_EXECUTOR_BASE: registry.cn-hangzhou.aliyuncs.com/nothing/multica-executor-base
  ALIYUN_IMAGE_EXECUTOR_CLAUDE: registry.cn-hangzhou.aliyuncs.com/nothing/multica-executor-claude
  ALIYUN_IMAGE_EXECUTOR_DSH: registry.cn-hangzhou.aliyuncs.com/nothing/multica-executor-dsh
  GO_VERSION: '1.26'

jobs:
  # ─── push: 仅运行 Go 测试（后端质量门禁；前端测试走上游 ci.yml） ───
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum

      - name: Run tests
        working-directory: server
        run: go test ./... -count=1

  # ─── push: 构建 & 推送 backend 镜像 ───
  build-and-push-backend:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The version stamp needs git describe over full history + tags;
          # tags are fetched explicitly in the Compute version stamp step
          # (checkout's fetch-tags input only applies to shallow clones).
          fetch-depth: 0

      # Branch builds must not bake ref_name (e.g. "utter-main") as the CLI
      # version: the server's quick-create gate parses daemon cli_version and
      # fails closed (ErrCLIVersionMissing) on unparsable strings. Match
      # make build / make daemon — stamp git describe so branch images report
      # the vX.Y.Z-N-g<sha> dev-build shape (exempt from the gate) while
      # pinning the exact commit; tagged builds describe to the tag itself,
      # so their stamp is unchanged.
      - name: Compute version stamp
        run: |
          # Tags must be present for describe to resolve (checkout's
          # fetch-tags only applies to shallow clones); without them describe
          # falls back to a bare sha that the server's version gate rejects.
          git fetch --tags --force origin
          VERSION="$(git describe --tags --match 'v[0-9]*' --always --dirty 2>/dev/null || echo dev)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version stamp: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Alibaba Cloud Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}/multica-backend
            ${{ env.ALIYUN_IMAGE_BACKEND }}
          # sha 前缀 tag 用于部署回滚；部署时固定 MULTICA_IMAGE_TAG，不要用 latest
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=Multica Backend
            org.opencontainers.image.description=Multica self-hosted backend (utter-office fork)

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          pull: true
          platforms: linux/amd64
          push: true
          # 阿里云 ACR 拒绝 provenance 空 OCI manifest（application/vnd.oci.empty.v1+json），
          # 禁用 attestation 保证双 registry 推送兼容（同 utter-office）
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ github.sha }}

  # ─── push: 构建 & 推送 web 镜像 ───
  build-and-push-web:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The version stamp needs git describe over full history + tags;
          # tags are fetched explicitly in the Compute version stamp step
          # (checkout's fetch-tags input only applies to shallow clones).
          fetch-depth: 0

      # Same stamp as the backend/executor jobs (see build-and-push-backend):
      # branch builds report a git-describe string instead of the raw ref name.
      - name: Compute version stamp
        run: |
          # Tags must be present for describe to resolve (checkout's
          # fetch-tags only applies to shallow clones); without them describe
          # falls back to a bare sha that the server's version gate rejects.
          git fetch --tags --force origin
          VERSION="$(git describe --tags --match 'v[0-9]*' --always --dirty 2>/dev/null || echo dev)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version stamp: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Alibaba Cloud Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}/multica-web
            ${{ env.ALIYUN_IMAGE_WEB }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=Multica Web
            org.opencontainers.image.description=Multica self-hosted web frontend (utter-office fork)

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          pull: true
          platforms: linux/amd64
          push: true
          # ACR 兼容，同上
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_APP_VERSION=${{ env.VERSION }}

  # ─── push: 构建 & 推送 executor 镜像（三层拆分） ───
  # 构建链：executor-base（needs backend）→ executor-claude / executor-dsh / executor（全量）
  # base 层只构建一次，runtime 变体薄层叠加，缓存与下载带宽最大化复用
  build-and-push-executor-base:
    if: github.event_name == 'push'
    needs: [test, build-and-push-backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The version stamp needs git describe over full history + tags;
          # tags are fetched explicitly in the Compute version stamp step
          # (checkout's fetch-tags input only applies to shallow clones).
          fetch-depth: 0

      # Same stamp as the backend job (see build-and-push-backend): the
      # multica CLI inside the executor images is COPY'd from the backend
      # image, so its cli_version must stay a parseable/exempt string or the
      # server's quick-create gate rejects every agent on this executor.
      - name: Compute version stamp
        run: |
          # Tags must be present for describe to resolve (checkout's
          # fetch-tags only applies to shallow clones); without them describe
          # falls back to a bare sha that the server's version gate rejects.
          git fetch --tags --force origin
          VERSION="$(git describe --tags --match 'v[0-9]*' --always --dirty 2>/dev/null || echo dev)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version stamp: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Alibaba Cloud Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}/multica-executor-base
            ${{ env.ALIYUN_IMAGE_EXECUTOR_BASE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=Multica Executor Base
            org.opencontainers.image.description=Multica agent executor base layer (utter-office fork)

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/executor/Dockerfile.base
          pull: true
          platforms: linux/amd64
          push: true
          # ACR 兼容，同上
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ github.sha }}
            MULTICA_IMAGE=${{ env.ALIYUN_IMAGE_BACKEND }}
            MULTICA_TAG=${{ github.ref_name }}

  # ─── push: executor-claude（base + Claude Code） ───
  build-and-push-executor-claude:
    if: github.event_name == 'push'
    needs: [test, build-and-push-executor-base]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The version stamp needs git describe over full history + tags;
          # tags are fetched explicitly in the Compute version stamp step
          # (checkout's fetch-tags input only applies to shallow clones).
          fetch-depth: 0

      # Same stamp as the backend job (see build-and-push-backend).
      - name: Compute version stamp
        run: |
          # Tags must be present for describe to resolve (checkout's
          # fetch-tags only applies to shallow clones); without them describe
          # falls back to a bare sha that the server's version gate rejects.
          git fetch --tags --force origin
          VERSION="$(git describe --tags --match 'v[0-9]*' --always --dirty 2>/dev/null || echo dev)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version stamp: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Alibaba Cloud Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}/multica-executor-claude
            ${{ env.ALIYUN_IMAGE_EXECUTOR_CLAUDE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=Multica Executor Claude
            org.opencontainers.image.description=Multica agent executor with Claude Code (utter-office fork)

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/executor/Dockerfile.claude
          pull: true
          platforms: linux/amd64
          push: true
          # ACR 兼容，同上
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ github.sha }}
            BASE_IMAGE=${{ env.ALIYUN_IMAGE_EXECUTOR_BASE }}
            BASE_TAG=${{ github.ref_name }}

  # ─── push: executor-dsh（base + DeepSeek Harness） ───
  build-and-push-executor-dsh:
    if: github.event_name == 'push'
    needs: [test, build-and-push-executor-base]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The version stamp needs git describe over full history + tags;
          # tags are fetched explicitly in the Compute version stamp step
          # (checkout's fetch-tags input only applies to shallow clones).
          fetch-depth: 0

      # Same stamp as the backend job (see build-and-push-backend).
      - name: Compute version stamp
        run: |
          # Tags must be present for describe to resolve (checkout's
          # fetch-tags only applies to shallow clones); without them describe
          # falls back to a bare sha that the server's version gate rejects.
          git fetch --tags --force origin
          VERSION="$(git describe --tags --match 'v[0-9]*' --always --dirty 2>/dev/null || echo dev)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version stamp: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Alibaba Cloud Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}/multica-executor-dsh
            ${{ env.ALIYUN_IMAGE_EXECUTOR_DSH }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=Multica Executor DSH
            org.opencontainers.image.description=Multica agent executor with DeepSeek Harness (utter-office fork)

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/executor/Dockerfile.dsh
          pull: true
          platforms: linux/amd64
          push: true
          # ACR 兼容，同上
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ github.sha }}
            BASE_IMAGE=${{ env.ALIYUN_IMAGE_EXECUTOR_BASE }}
            BASE_TAG=${{ github.ref_name }}

  # ─── push: executor 全量（base + Claude Code + dsh，compose 默认） ───
  build-and-push-executor:
    if: github.event_name == 'push'
    needs: [test, build-and-push-executor-base]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The version stamp needs git describe over full history + tags;
          # tags are fetched explicitly in the Compute version stamp step
          # (checkout's fetch-tags input only applies to shallow clones).
          fetch-depth: 0

      # Same stamp as the backend job (see build-and-push-backend).
      - name: Compute version stamp
        run: |
          # Tags must be present for describe to resolve (checkout's
          # fetch-tags only applies to shallow clones); without them describe
          # falls back to a bare sha that the server's version gate rejects.
          git fetch --tags --force origin
          VERSION="$(git describe --tags --match 'v[0-9]*' --always --dirty 2>/dev/null || echo dev)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version stamp: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Alibaba Cloud Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}/multica-executor
            ${{ env.ALIYUN_IMAGE_EXECUTOR }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=Multica Executor
            org.opencontainers.image.description=Multica agent executor container, full runtime (utter-office fork)

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/executor/Dockerfile
          pull: true
          platforms: linux/amd64
          push: true
          # ACR 兼容，同上
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
